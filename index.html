
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sindhi Urdu Vocal Maker</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>🎤 Sindhi Urdu Vocal Maker</h1>
    <p>AI Powered Vocal & Music Separator</p>
  </header>

  <main>

    <section class="upload-box">

      <h2>🎵 Upload Your Song</h2>

      <p>
        Upload an audio file and separate
        vocals from music using AI.
      </p>

      <input
        type="file"
        id="audioFile"
        accept="audio/*"
      >

      <button onclick="startProcessing()">
        🤖 Separate Vocals
      </button>

      <p id="status"></p>

    </section>

  </main>

  <footer>
    <p>© 2026 Sindhi Urdu Vocal Maker | AI Music Studio</p>
  </footer>

  <script src="script.js"></script>

</body>
</html>
